# Sirve el build estático de las tres aplicaciones. Las rutas de cada SPA vuelven
# a su propio index.html.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /analytics/ {
        try_files $uri $uri/ /analytics/index.html;
    }

    location /admin/ {
        try_files $uri $uri/ /admin/index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Los ficheros de assets llevan un hash en el nombre: se pueden cachear un año.
    # Los index.html no, para que un despliegue nuevo se vea al recargar.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~ /index\.html$ {
        add_header Cache-Control "no-cache";
    }
}
