# Sirve el build estático de las tres aplicaciones. Las rutas de cada SPA vuelven
# a su propio index.html.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /analytics/ {
        try_files $uri $uri/ /analytics/index.html;
    }

    location /admin/ {
        try_files $uri $uri/ /admin/index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
