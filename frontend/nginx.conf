# Sirve el build estático de las tres aplicaciones. Las rutas de cada SPA vuelven
# a su propio index.html.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    # /admin y /analytics (sin barra) redirigen a su carpeta. La redirección va sin
    # host ni puerto: este nginx escucha en el 80 y, detrás del proxy, el navegador
    # está en otro (8080 en desarrollo). Lo encontró la prueba E2E de la fase 7b.
    absolute_redirect off;

    location /analytics/ {
        try_files $uri $uri/ /analytics/index.html;
    }

    location /admin/ {
        try_files $uri $uri/ /admin/index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Los ficheros de assets llevan un hash en el nombre: se pueden cachear un año.
    # Los index.html no, para que un despliegue nuevo se vea al recargar.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~ /index\.html$ {
        add_header Cache-Control "no-cache";
    }
}
