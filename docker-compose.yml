# Plataforma: 11 contenedores en 4 capas (más la tarea de migraciones).
# Versión completa del libro: 17 servicios (Capítulo 4). Se ampliará por fases.
#
# Arranque:  python scripts/generate_env.py && docker compose up -d --build
# Estado:    http://localhost:8080  (o el puerto de HTTP_PORT)

x-backend-env: &backend-env
  DB_HOST: mysql
  DB_PORT: "3306"
  DB_USER: ${DB_USER}
  DB_PASSWORD: ${DB_PASSWORD}
  DB_NAME_CORE: ${DB_NAME_CORE}
  DB_NAME_OPS: ${DB_NAME_OPS}
  DB_NAME_ANALYTICS: ${DB_NAME_ANALYTICS}
  DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
  DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-20}
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_PASSWORD: ${REDIS_PASSWORD}
  REDIS_DB_CACHE: ${REDIS_DB_CACHE:-0}
  REDIS_DB_CELERY: ${REDIS_DB_CELERY:-1}
  APP_SECRET_KEY: ${APP_SECRET_KEY}
  JWT_SECRET_KEY: ${JWT_SECRET_KEY}
  MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY}
  JWT_ACCESS_MINUTES: ${JWT_ACCESS_MINUTES:-30}
  JWT_REFRESH_MINUTES: ${JWT_REFRESH_MINUTES:-480}
  COOKIE_SECURE: ${COOKIE_SECURE:-false}
  LOGIN_MAX_FAILURES: ${LOGIN_MAX_FAILURES:-5}
  LOGIN_LOCK_MINUTES: ${LOGIN_LOCK_MINUTES:-15}
  AI_SERVICE_URL: http://ai_service:8000
  AI_SERVICE_API_KEY: ${AI_SERVICE_API_KEY}
  QDRANT_HOST: qdrant
  QDRANT_PORT: "6333"
  QDRANT_API_KEY: ${QDRANT_API_KEY}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  LOG_FORMAT: ${LOG_FORMAT:-json}
  TIMEZONE: ${TIMEZONE:-Europe/Madrid}
  RATE_LIMIT_READ: ${RATE_LIMIT_READ:-60}
  RATE_LIMIT_WRITE: ${RATE_LIMIT_WRITE:-20}
  RATE_LIMIT_UPLOAD: ${RATE_LIMIT_UPLOAD:-10}
  RATE_LIMIT_EXPORT: ${RATE_LIMIT_EXPORT:-5}
  DOCUMENT_STORAGE_PATH: /data/documents
  DOCUMENT_MAX_MB: ${DOCUMENT_MAX_MB:-100}
  OPPORTUNITY_FEEDS: ${OPPORTUNITY_FEEDS:-}
  ALERT_SCORE_THRESHOLD: ${ALERT_SCORE_THRESHOLD:-7.0}
  DEAL_STALLED_DAYS: ${DEAL_STALLED_DAYS:-14}
  NOTIFICATION_RETENTION_DAYS: ${NOTIFICATION_RETENTION_DAYS:-90}
  AUDIT_ANONYMIZE_DAYS: ${AUDIT_ANONYMIZE_DAYS:-365}
  CELERY_TASK_TIME_LIMIT: ${CELERY_TASK_TIME_LIMIT:-600}
  # Núcleo de IA (fase 5). El modelo de cada tarea se elige en Admin, no aquí.
  AI_ENABLED: ${AI_ENABLED:-true}
  AI_AUTO_ENRICH: ${AI_AUTO_ENRICH:-true}
  RATE_LIMIT_AI: ${RATE_LIMIT_AI:-10}
  RAG_SCORE_THRESHOLD: ${RAG_SCORE_THRESHOLD:-0.35}
  RAG_MAX_CHUNKS: ${RAG_MAX_CHUNKS:-6}
  RAG_EVAL_SAMPLE_RATE: ${RAG_EVAL_SAMPLE_RATE:-0.05}
  SEMANTIC_SCORING: ${SEMANTIC_SCORING:-true}
  AI_SAMPLE_RETENTION_DAYS: ${AI_SAMPLE_RETENTION_DAYS:-30}
  AI_USD_EUR_RATE: ${AI_USD_EUR_RATE:-0.92}
  # Búsqueda (fase 5b)
  MEILI_URL: http://meilisearch:7700
  MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
  SEARCH_ENABLED: ${SEARCH_ENABLED:-true}
  RATE_LIMIT_SEARCH: ${RATE_LIMIT_SEARCH:-120}
  SEARCH_SEMANTIC_RERANK: ${SEARCH_SEMANTIC_RERANK:-true}
  INTENT_LAYER1_THRESHOLD: ${INTENT_LAYER1_THRESHOLD:-0.75}
  INTENT_LLM_ENABLED: ${INTENT_LLM_ENABLED:-true}
  SEARCH_LOG_RETENTION_DAYS: ${SEARCH_LOG_RETENTION_DAYS:-90}
  # Copiloto y agentes (fase 5c)
  COPILOT_HISTORY_TURNS: ${COPILOT_HISTORY_TURNS:-10}
  AGENT_APPROVAL_TTL_MINUTES: ${AGENT_APPROVAL_TTL_MINUTES:-15}
  MEMORY_MAX_PER_USER: ${MEMORY_MAX_PER_USER:-50}
  MEMORY_INJECT: ${MEMORY_INJECT:-10}
  MEMORY_EXTRACT_ENABLED: ${MEMORY_EXTRACT_ENABLED:-true}
  # Correo de avisos (fase 8)
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_SECURITY: ${SMTP_SECURITY:-starttls}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  EMAIL_FROM: ${EMAIL_FROM:-}
  EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-PLATIA}
  EMAIL_PRIORITIES: ${EMAIL_PRIORITIES:-high,urgent}
  PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
  SERVER_NAME: ${SERVER_NAME:-}
  AI_DISCLOSURE_TEXT: ${AI_DISCLOSURE_TEXT-Documento elaborado con ayuda de inteligencia artificial y revisado por el equipo.}

services:
  # ======================================================
  # CAPA DE DATOS: solo accesible desde data_net
  # ======================================================
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      DB_NAME_CORE: ${DB_NAME_CORE}
      DB_NAME_OPS: ${DB_NAME_OPS}
      DB_NAME_ANALYTICS: ${DB_NAME_ANALYTICS}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    mem_limit: 2g
    restart: unless-stopped
    networks: [data_net]

  redis:
    image: redis:7-alpine
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --appendonly yes"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
    mem_limit: 512m
    restart: unless-stopped
    networks: [data_net]

  qdrant:
    image: qdrant/qdrant:v1.13.4
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY}
    volumes:
      - qdrant_data:/qdrant/storage
    mem_limit: 2g
    restart: unless-stopped
    networks: [data_net]

  # Búsqueda de texto (Capítulo 13). Un solo binario: sin cluster ni JVM.
  # 512 MB de memoria de indexación, la cifra que usa el libro.
  meilisearch:
    image: getmeili/meilisearch:v1.54.3
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      MEILI_ENV: production
      MEILI_NO_ANALYTICS: "true"
      MEILI_MAX_INDEXING_MEMORY: 512Mb
      MEILI_LOG_LEVEL: WARN
    volumes:
      - meili_data:/meili_data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:7700/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    mem_limit: 1g
    restart: unless-stopped
    networks: [data_net]

  # ======================================================
  # CAPA DE APLICACIÓN: backend_net + data_net
  # ======================================================
  # Tarea de un solo uso: aplica migraciones y datos iniciales y termina (fase 2)
  migrations:
    build: ./backend
    environment:
      <<: *backend-env
      FLASK_APP: wsgi.py
    command: ["sh", "-c", "flask db upgrade && flask seed"]
    depends_on:
      mysql:
        condition: service_healthy
    restart: "no"
    networks: [data_net]

  backend:
    build: ./backend
    environment: *backend-env
    volumes:
      - documents_data:/data/documents
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    mem_limit: 1g
    restart: unless-stopped
    networks: [backend_net, data_net]

  ai_service:
    build: ./ai_service
    environment:
      AI_SERVICE_API_KEY: ${AI_SERVICE_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      CLAUDE_DEFAULT_MODEL: ${CLAUDE_DEFAULT_MODEL:-claude-sonnet-5-5}
      CLAUDE_PREMIUM_MODEL: ${CLAUDE_PREMIUM_MODEL:-claude-opus-5-5}
      CLAUDE_FAST_MODEL: ${CLAUDE_FAST_MODEL:-claude-haiku-5-5}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-180}
      FALLBACK_LLM_BASE_URL: ${FALLBACK_LLM_BASE_URL:-}
      FALLBACK_LLM_API_KEY: ${FALLBACK_LLM_API_KEY:-}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-local}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2}
      VOYAGE_API_KEY: ${VOYAGE_API_KEY:-}
      QDRANT_HOST: qdrant
      QDRANT_PORT: "6333"
      QDRANT_API_KEY: ${QDRANT_API_KEY}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on: [qdrant]
    healthcheck:
      test: ["CMD", "python", "-c", "import os, urllib.request as u; u.urlopen(u.Request('http://127.0.0.1:8000/health', headers={'X-API-Key': os.environ['AI_SERVICE_API_KEY']}), timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    mem_limit: 2g
    restart: unless-stopped
    networks: [backend_net, data_net]

  # ======================================================
  # CAPA DE WORKERS (Capítulo 8): mismo build que el backend
  # ======================================================
  # Colas rápidas: tareas generales, alertas, sincronización y CRM
  celery_default:
    build: ./backend
    command: ["celery", "-A", "celery_app", "worker", "-n", "default@%h", "-Q", "priority,default,sync,crm", "-c", "2", "--loglevel=info"]
    environment: *backend-env
    volumes:
      - documents_data:/data/documents
    depends_on: &worker-depends
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    mem_limit: 768m
    restart: unless-stopped
    networks: [backend_net, data_net]

  # Colas lentas: documentos e IA, para que no bloqueen a las rápidas
  celery_ai:
    build: ./backend
    command: ["celery", "-A", "celery_app", "worker", "-n", "ai@%h", "-Q", "ai,documents", "-c", "2", "--loglevel=info"]
    environment: *backend-env
    volumes:
      - documents_data:/data/documents
    depends_on: *worker-depends
    mem_limit: 1g
    restart: unless-stopped
    networks: [backend_net, data_net]

  # Planificador de tareas programadas. Una sola instancia (Capítulo 8).
  celery_beat:
    build: ./backend
    command: ["celery", "-A", "celery_app", "beat", "--schedule", "/tmp/celerybeat-schedule", "--loglevel=info"]
    environment: *backend-env
    depends_on: *worker-depends
    mem_limit: 256m
    restart: unless-stopped
    networks: [data_net]

  # ======================================================
  # CAPA DE FRONTALES
  # ======================================================
  frontend:
    build: ./frontend
    mem_limit: 256m
    restart: unless-stopped
    networks: [frontend_net]

  # ======================================================
  # PROXY INVERSO: único servicio con puerto publicado
  # ======================================================
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
    depends_on: [backend, frontend]
    mem_limit: 256m
    restart: unless-stopped
    networks: [frontend_net, backend_net]

# Redes con mínimo privilegio: los datos nunca son visibles desde el proxy
networks:
  frontend_net:
  backend_net:
  data_net:

volumes:
  documents_data:
  meili_data:
  mysql_data:
  redis_data:
  qdrant_data:
