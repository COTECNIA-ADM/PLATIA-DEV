# Rutas comunes a desarrollo (nginx.conf) y producción (prod.conf.template).
# Se incluyen dentro de un bloque server que define $backend_upstream, $frontend_upstream
# y $hsts (vacío en desarrollo: nginx no envía una cabecera con valor vacío).

location /api/ {
    proxy_pass $backend_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;

    # Respuestas en streaming (SSE) del chat con Claude: sin buffer
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_read_timeout 300s;
}

# Las respuestas de /api/ ya llevan sus cabeceras OWASP desde el backend.
# Estas son para el frontal (Capítulo 6): solo recursos del mismo origen.
location / {
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Strict-Transport-Security $hsts always;

    proxy_pass $frontend_upstream;
    proxy_set_header Host $host;
}
