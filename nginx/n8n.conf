# Editor y webhooks de n8n (ADR-020). Solo se monta con docker-compose.n8n.yml.
# Va en un puerto propio y en la raíz: n8n desaconseja servirlo en una subruta.

map $http_upgrade $n8n_connection {
    default upgrade;
    ''      close;
}

server {
    listen 5679;

    set $n8n_upstream http://n8n:5678;

    location / {
        proxy_pass $n8n_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;

        # El editor recibe los cambios por WebSocket
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $n8n_connection;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}
