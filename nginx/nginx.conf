# Proxy inverso: punto de entrada único (Capítulos 4 y 21).
# El servicio de IA no se publica: solo el backend habla con él.

server_tokens off;
client_max_body_size 100m;

# DNS interno de Docker. Resolver en cada petición evita 502 cuando un
# contenedor se recrea y cambia de IP.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    set $backend_upstream http://backend:5000;
    set $frontend_upstream http://frontend:80;

    location /api/ {
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;

        # Respuestas en streaming (SSE) del chat con Claude: sin buffer
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location / {
        proxy_pass $frontend_upstream;
        proxy_set_header Host $host;
    }
}
