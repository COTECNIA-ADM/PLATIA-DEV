name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    # Meilisearch real para los tests de integración del buscador (test_search_meili.py)
    services:
      meilisearch:
        image: getmeili/meilisearch:v1.54.3
        env:
          MEILI_MASTER_KEY: ci-meili-master-key-0123456789
          MEILI_NO_ANALYTICS: "true"
        ports: ["7700:7700"]
    env:
      MEILI_TEST_URL: http://localhost:7700
      MEILI_TEST_KEY: ci-meili-master-key-0123456789
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  ai_service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai_service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run build

  migrations:
    # Aplica las migraciones en un MySQL 8.0 real: upgrade, sin deriva, downgrade y upgrade
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-root
          MYSQL_USER: platia
          MYSQL_PASSWORD: ci-pass
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-root"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      DB_USER: platia
      DB_PASSWORD: ci-pass
      REDIS_HOST: localhost
      REDIS_PASSWORD: no-usado
      APP_SECRET_KEY: ci-secret
      AI_SERVICE_URL: http://localhost:8000
      AI_SERVICE_API_KEY: no-usado
      JWT_SECRET_KEY: ci-jwt-secret-solo-para-la-ci-0123456789
      MFA_ENCRYPTION_KEY: Y2xhdmUtZGUtdGVzdC1zb2xvLXBhcmEtcHl0ZXN0ISE=
      FLASK_APP: wsgi.py
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Crear los tres esquemas
        run: |
          for db in platform_core operations_db analytics_db; do
            mysql -h 127.0.0.1 -uroot -pci-root -e "CREATE DATABASE $db CHARACTER SET utf8mb4 COLLATE utf8mb4_0900_ai_ci; GRANT ALL ON $db.* TO 'platia'@'%';"
          done
      - run: flask db upgrade
      - name: Los modelos y las migraciones coinciden
        run: flask db check
      - run: flask seed && flask seed
      - run: flask db downgrade base
      - run: flask db upgrade

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar docker-compose con un .env generado
        run: |
          python scripts/generate_env.py
          docker compose config -q
